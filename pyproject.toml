[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linktwin"
version = "0.1.0"
description = "Full-link digital twin for automotive Ethernet harnesses: chain measured cable data and connector models, predict link-segment pass/fail with uncertainty, and estimate the eye at the receiver - before the harness exists."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sreeram Anil" }]
keywords = ["digital-twin", "signal-integrity", "eye-diagram", "automotive-ethernet", "monte-carlo", "uncertainty-quantification", "1000base-t1", "equalization", "transmission-lines", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "cablecheck>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.8"]
stack = ["labauto>=0.1", "labplatform>=0.1", "cableanalytics>=0.1", "zprofile>=0.1"]

[project.urls]
Homepage = "https://github.com/anilram30/linktwin"
Toolchain = "https://github.com/anilram30/hf-cable-toolchain"
Report = "https://github.com/anilram30/linktwin/blob/main/docs/report.pdf"
Issues = "https://github.com/anilram30/linktwin/issues"
Changelog = "https://github.com/anilram30/linktwin/blob/main/CHANGELOG.md"

[project.scripts]
linktwin = "linktwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"linktwin" = ["harnesses/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E702 and E731: this codebase deliberately groups short related statements on one line
# (plotting calls, tuple unpacking) and uses small lambdas for local helpers.
# E741: `l` reads naturally for an inductance or a length in transmission-line code.
ignore = ["E702", "E731", "E741"]
